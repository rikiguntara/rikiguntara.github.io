<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riki Guntara | Network Terminal</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* Reset & Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Share Tech Mono', monospace;
      background-color: #020208;
      color: #00f0ff;
      overflow-x: hidden;
    }

    /* Efek Scanline TV Tabung */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
      z-index: 10;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    .main-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 0;
      z-index: 1;
    }

    #matrix-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      opacity: 0.15; /* Latar belakang matrix samar yang elegan */
    }

    /* ID Card Panel */
    .profile-card {
      position: relative;
      z-index: 3;
      max-width: 550px;
      width: 90%;
      background: rgba(8, 5, 18, 0.85);
      border: 1px solid #00f0ff;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
      clip-path: polygon(0 0, 88% 0, 100% 12%, 100% 100%, 12% 100%, 0 88%);
    }

    /* Aksen Sudut Merah */
    .profile-card::before {
      content: 'ID: RG-99X';
      position: absolute;
      top: 5px; left: 15px;
      font-size: 0.75rem;
      color: #ff0055;
      letter-spacing: 2px;
    }

    /* Tempat Foto / Avatar Hologram */
    .avatar-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 1.5rem auto;
    }

    .avatar-glow {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: 2px dashed #00f0ff;
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }

    .avatar-image {
      position: absolute;
      top: 10px; left: 10px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #ff0055;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ganti huruf 'RG' ini dengan tag <img src="foto-kamu.jpg"> jika sudah ada fotonya */
    .avatar-image span {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 8px #ff0055;
    }

    /* Animasi Nama Glitch */
    h1.user-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 4px;
      margin-bottom: 0.2rem;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }

    p.user-role {
      font-size: 0.95rem;
      color: #ff0055;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    /* Terminal Mini Log */
    .terminal-log {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 0.8rem;
      font-size: 0.8rem;
      text-align: left;
      color: #64748b;
      margin-bottom: 2rem;
      border-radius: 4px;
    }
    .terminal-log span { color: #00f0ff; }

    /* HUD Countdown */
    .hud-timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 2.5rem;
    }

    .timer-node {
      background: rgba(0, 240, 255, 0.02);
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 0.8rem 0;
    }

    .node-num {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      color: #fff;
    }

    .node-lbl {
      display: block;
      font-size: 0.7rem;
      color: #00f0ff;
      opacity: 0.7;
      margin-top: 2px;
    }

    /* Tombol Kontak Terminal */
    .action-btn {
      background: transparent;
      border: 1px solid #ff0055;
      color: #ff0055;
      padding: 0.8rem 2rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .action-btn:hover {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 15px #ff0055;
    }

    /* Kustomisasi SweetAlert (Tetap Presisi di Tengah) */
    .personal-swal {
      background: #080512 !important;
      border: 1px solid #00f0ff !important;
      border-radius: 0px !important;
    }
    .personal-swal-title {
      color: #fff !important;
      font-family: 'Orbitron', sans-serif !important;
      text-align: center !important;
    }
    .personal-swal-text {
      color: #00f0ff !important;
      text-align: center !important;
      font-family: 'Share Tech Mono', monospace !important;
    }
    .personal-swal-btn {
      background: transparent !important;
      border: 1px solid #ff0055 !important;
      color: #ff0055 !important;
      padding: 0.5rem 2rem !important;
      border-radius: 0px !important;
    }
    .personal-swal-btn:hover {
      background: #ff0055 !important;
      color: white !important;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <div class="main-wrapper">
    <canvas id="matrix-canvas"></canvas>

    <div class="profile-card">
      
      <div class="avatar-container">
        <div class="avatar-glow"></div>
        <div class="avatar-image">
          <span>RG</span> 
        </div>
      </div>

      <h1 class="user-name">RIKI GUNTARA</h1>
      <p class="user-role">// DIGITAL CREATIVE & DEVELOPER</p>

      <div class="terminal-log">
        > STATUS: <span>ONLINE</span><br>
        > HOST: <span>RIKI_GUNTARA//NODE_01</span><br>
        > DEPLOYMENT: <span>IN PROGRESS...</span>
      </div>

      <div class="hud-timer" id="timer-display">
        <div class="timer-node">
          <span class="node-num" id="days">00</span>
          <span class="node-lbl">DAYS</span>
        </div>
        <div class="timer-node">
          <span class="node-num" id="hours">00</span>
          <span class="node-lbl">HOURS</span>
        </div>
        <div class="timer-node">
          <span class="node-num" id="minutes">00</span>
          <span class="node-lbl">MINS</span>
        </div>
        <div class="timer-node">
          <span class="node-num" id="seconds">00</span>
          <span class="node-lbl">SECS</span>
        </div>
      </div>

      <button class="action-btn" onclick="openTerminal()">Establish Connection</button>
    </div>
  </div>

  <script>
    (function () {
      const second = 1000, minute = second * 60, hour = minute * 60, day = hour * 24;
      const targetMonthDay = "04/19/"; 
      let currentYear = new Date().getFullYear();
      let targetDate = new Date(targetMonthDay + currentYear).getTime();

      if (new Date().getTime() > targetDate) {
        targetDate = new Date(targetMonthDay + (currentYear + 1)).getTime();
      }

      const x = setInterval(function () {
        const now = new Date().getTime();
        const distance = targetDate - now;

        document.getElementById("days").innerText = String(Math.floor(distance / day)).padStart(2, "0");
        document.getElementById("hours").innerText = String(Math.floor((distance % day) / hour)).padStart(2, "0");
        document.getElementById("minutes").innerText = String(Math.floor((distance % hour) / minute)).padStart(2, "0");
        document.getElementById("seconds").innerText = String(Math.floor((distance % minute) / second)).padStart(2, "0");

        if (distance < 0) {
          document.getElementById("timer-display").innerHTML = "<div style='grid-column: span 4; color: #ff0055;'>WELCOME TO THE NEXT LEVEL.</div>";
          clearInterval(x);
        }
      }, 1000);
    }());

    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const fontSize = 14;
    let columns = canvas.width / fontSize;
    let drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(2, 2, 8, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00f0ff';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);
    function openTerminal() {
      Swal.fire({
        title: 'CONNECTED',
        html: 'Uplink ke jaringan Riki Guntara berhasil dibuka. <br><br><i>"The future belongs to those who build it."</i>',
        icon: 'info',
        iconColor: '#00f0ff',
        confirmButtonText: 'CLOSE TERMINAL',
        customClass: {
          popup: 'personal-swal',
          title: 'personal-swal-title',
          htmlContainer: 'personal-swal-text',
          confirmButton: 'personal-swal-btn'
        },
        buttonsStyling: false
      });
    }
  </script>

</body>
</html>
